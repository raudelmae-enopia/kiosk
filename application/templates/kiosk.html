<!-- ====================================
         ITEM MODAL
    ===================================== -->

<div id="itemModal" class="item-modal">
  <div class="modal-backdrop" onclick="closeItemModal()"></div>

  <div class="item-modal-card">
    <h2 id="modalItemName">Item</h2>

    <img
      id="modalItemImage"
      src="/static/images/items/placeholder.jpg"
      alt="Item"
    />

    <div id="modalPrice" class="modal-price"></div>

    <!-- Drink sizes -->

    <div id="sizeOptions" class="size-options">
      <button onclick="selectSize('Small', 170)">
        <strong>SMALL</strong>
        <span>₱170</span>
      </button>

      <button onclick="selectSize('Medium', 200)">
        <strong>MEDIUM</strong>
        <span>₱200</span>
      </button>

      <button onclick="selectSize('Large', 230)">
        <strong>LARGE</strong>
        <span>₱230</span>
      </button>
    </div>

    <div class="modal-actions">
      <button class="modal-back-button" onclick="closeItemModal()">
        ← Back
      </button>

      <button class="modal-add-button" onclick="addCurrentItem()">
        ＋ Add
      </button>
    </div>
  </div>
</div>

<script>
  let selectedItem = null;
  let selectedSize = null;
  let selectedPrice = null;

  /* ================================
       CATEGORY NAVIGATION
    ================================ */

  function showCategory(categoryId) {
    const section = document.getElementById(categoryId);

    if (!section) return;

    section.scrollIntoView({
      behavior: "smooth",
      block: "start",
    });

    document.querySelectorAll(".category-button").forEach((button) => {
      button.classList.remove("active");
    });

    event.currentTarget.classList.add("active");
  }

  /* ================================
       ITEM MODAL
    ================================ */

  function openItemModal(name, image, price, hasSizes) {
    selectedItem = name;
    selectedSize = null;
    selectedPrice = null;

    document.getElementById("modalItemName").textContent = name;

    document.getElementById("modalItemImage").src = image;

    document.getElementById("modalPrice").textContent = price;

    const sizes = document.getElementById("sizeOptions");

    if (hasSizes) {
      sizes.style.display = "grid";
    } else {
      sizes.style.display = "none";
    }

    document.getElementById("itemModal").classList.add("active");
  }

  /* ================================
       CLOSE MODAL
    ================================ */

  function closeItemModal() {
    document.getElementById("itemModal").classList.remove("active");
  }

  /* ================================
       SIZE
    ================================ */

  function selectSize(size, price) {
    selectedSize = size;
    selectedPrice = price;

    document.querySelectorAll(".size-options button").forEach((button) => {
      button.classList.remove("selected");
    });

    event.currentTarget.classList.add("selected");
  }

  /* ================================
       ADD ITEM
    ================================ */

  function addCurrentItem() {
    if (!selectedItem) {
      return;
    }

    /* Drinks must have a size */

    if (
      document.getElementById("sizeOptions").style.display !== "none" &&
      !selectedSize
    ) {
      alert("Please select a size.");

      return;
    }

    console.log("Added:", selectedItem, selectedSize, selectedPrice);

    closeItemModal();
  }

  /* ================================
       CART
    ================================ */

  function openCart() {
    /*
     * Cart functionality will be connected
     * to the backend later.
     */

    alert("Cart UI coming next.");
  }
</script>
