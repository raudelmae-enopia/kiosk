{% for item in menu_items %}

<div class="menu-item">
  <h3>{{ item.name }}</h3>

{% if item.description %}

  <p>{{ item.description }}</p>
  {% endif %}

{% for size in item.sizes %}

  <p>
    {{ size.size }} ₱{{ "%.2f"|format(size.price) }}

```
<form method="POST" action="{{ url_for('cart.add_to_cart') }}">
  <input
    type="hidden"
    name="menu_item_size_id"
    value="{{ size.id }}"
  >

  <button type="submit">Add</button>
</form>
```

  </p>
  {% endfor %}

</div>

{% endfor %}
